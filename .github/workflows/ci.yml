name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Harness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        # The harness tests only need the stdlib plus fastapi for the serve
        # API tests; skip the heavy RAG dependencies (chromadb /
        # sentence-transformers).
        run: |
          pip install pytest fastapi httpx
          pip install -e . --no-deps

      - name: Test
        run: pytest

  web:
    name: Web UI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openharness/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: openharness/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
