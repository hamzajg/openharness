[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openharness"
version = "0.1.0"
description = "OpenHarness — workspace manager + context package for agent-driven development"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastapi",
    "uvicorn",
    "chromadb",
    "sentence-transformers",
]

[project.scripts]
oh = "openharness.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["openharness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["sources", ".git", "node_modules", ".venv", "openharness/web"]
pythonpath = ["."]
addopts = "-q"
